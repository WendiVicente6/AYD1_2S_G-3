
name: CI - EduConnect

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Pruebas del backend Flask
  backend-tests:
    name: 1. Backend - Python
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas Python
        run: python -m pytest -q

  # 2. Compilacion del frontend React + Vite
  frontend-build:
    name: 2. Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build

  # 3. Prueba E2E con Cypress
  e2e-cypress:
    name: 3. E2E - Cypress
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar prueba E2E
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install-command: npm ci
          start: npm run dev -- --host 127.0.0.1
          wait-on: "http://127.0.0.1:5173"
          wait-on-timeout: 120
          spec: cypress/e2e/202106484.cy.js
