name: CI/CD Educonnect 2026

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  # TAG usa el SHA del commit para identificar unicamente cada imagen
  TAG: ${{ github.sha }}

jobs:

  # Ejecuta las pruebas unitarias del backend.
  # Corre en cualquier push o pull_request, sin importar la rama
  test:
    name: 1. Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar dependencias del backend
        working-directory: Backend
        run: npm ci

      # continue-on-error permite que el pipeline continúe aunque fallen pruebas unitarias, para que el job de reporte final pueda mostrar el resultado completo.
      - name: Ejecutar pruebas unitarias
        working-directory: Backend
        run: npm test -- --watchAll=false --coverage
        continue-on-error: true

      - name: Mostrar resumen de pruebas
        run: |
          echo "Pruebas ejecutadas. Reporte de cobertura disponible en coverage/"
      
      #- name: Ejemplo laboratorio
       # run: |
        #  echo "Este paso es solo un ejemplo de laboratorio"
         # echo "Se puede agregar cualquier comando adicional aquí"      

  
  
  report:
    name: 2. Resumen Final
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
      - name: Generar reporte del pipeline
        run: |
          echo "=========================================="
          echo "REPORTE DEL PIPELINE CI/CD"
          echo "Rama   : ${{ github.ref_name }}"
          echo "=========================================="
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "TEST     : OK"
          else
            echo "TEST     : FALLO"
          fi
          echo "=========================================="