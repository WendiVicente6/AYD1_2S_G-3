name: CI/CD Educonnect 2026

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: 1. Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Ejecutar pruebas unitarias
        working-directory: backend
        run: npm test -- --watchAll=false --coverage
        continue-on-error: true

      - name: Mostrar resumen de pruebas
        run: |
          echo "Pruebas ejecutadas. Reporte de cobertura disponible en coverage/"

  report:
    name: 2. Resumen Final
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
      - name: Generar reporte del pipeline
        run: |
          echo "=========================================="
          echo "REPORTE DEL PIPELINE CI/CD"
          echo "Rama   : ${{ github.ref_name }}"
          echo "=========================================="
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "TEST     : OK"
          else
            echo "TEST     : FALLO"
          fi
          echo "=========================================="