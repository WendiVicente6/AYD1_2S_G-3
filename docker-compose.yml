services:

  db:
    image: postgres:16
    container_name: educonnect_db

    environment:
      POSTGRES_DB: EduConnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/BD:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EduConnect"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./Backend

    container_name: educonnect_backend

    env_file:
      - ./Backend/.env

    ports:
      - "5000:5000"

    volumes:
      - ./Backend:/app

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend

    container_name: educonnect_frontend

    environment:
      VITE_API_URL: http://localhost:5000/api

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


volumes:
  postgres_data: